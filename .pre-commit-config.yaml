# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contained the double
# quotes from the rcmdcheck --as-cran argument). The chain now lives in
# tools/verify.R, so the hook invokes a script path and no shell quoting is
# involved at all. Keeping it in a file also means the gate is runnable on
# demand -- `Rscript tools/verify.R` -- instead of only as a side effect of
# pushing, which matters while the remote is unreachable.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # The imported validator corpus is deliberately byte-sensitive: fixtures
      # exercise trailing whitespace, CR/CRLF/CR line endings, BOMs, and
      # UTF-16, so the whitespace/EOL-normalizing hooks must not rewrite them.
      - id: end-of-file-fixer
        exclude: ^tests/testthat/fixtures/corpus/
      # README.md is generated by `devtools::build_readme()`, whose printed
      # tibble blocks carry column-padding trailing spaces. Stripping them here
      # made the committed file permanently unequal to what its own generator
      # produces, so the `readme` verify stage -- which re-renders and diffs --
      # could never pass (SITE-vntocfbg). A generated artifact belongs to its
      # generator; edit README.Rmd.
      - id: trailing-whitespace
        exclude: ^(tests/testthat/fixtures/corpus/|README\.md$)
      - id: check-merge-conflict
      - id: check-yaml
      # air.toml is the only TOML in the tree, and it drives the air-format
      # hook below. Unparseable TOML there would otherwise reach main and
      # surface as a formatter failure on someone else's machine.
      - id: check-toml
      - id: mixed-line-ending
        exclude: ^tests/testthat/fixtures/corpus/
      - id: check-case-conflict
  # Air: fast, R-free (Rust binary) formatter for R sources. Runs per commit and
  # auto-fixes; air.toml controls style + exclusions (so data-raw/ dev scripts
  # are skipped even when staged). Using the managed air-pre-commit repo instead
  # of a local `air format` hook means contributors do not need air on PATH,
  # and the version is pinned here. https://posit-dev.github.io/air/
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
  - repo: local
    hooks:
      - id: verify
        name: verify (mirrors CI)
        entry: Rscript tools/verify.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
