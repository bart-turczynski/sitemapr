# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself, the former tools/verify.R chain (docs drift, the
# registry, R-floor and line-width guards, spelling, incoming, lintr, URLs)
# plus README drift, the NEWS heading and R CMD check, is in .fleet-ci.yml,
# never here: this file must not run .fleet-ci/gate (fleet-ci README, "The
# local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # The imported validator corpus is deliberately byte-sensitive: fixtures
      # exercise trailing whitespace, CR/CRLF/CR line endings, BOMs, and
      # UTF-16, so the whitespace/EOL-normalizing hooks must not rewrite them.
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      - id: end-of-file-fixer
        exclude: ^(\.fleet-ci/|tests/testthat/fixtures/corpus/)
      # README.md is generated by `devtools::build_readme()`, whose printed
      # tibble blocks carry column-padding trailing spaces. Stripping them here
      # made the committed file permanently unequal to what its own generator
      # produces, so the README drift gate -- which re-renders and diffs --
      # could never pass (SITE-vntocfbg). A generated artifact belongs to its
      # generator; edit README.Rmd.
      - id: trailing-whitespace
        exclude: ^(\.fleet-ci/|tests/testthat/fixtures/corpus/|README\.md$)
      - id: check-merge-conflict
      - id: check-yaml
      # air.toml is the only TOML in the tree, and it drives the air-format
      # hook below. Unparseable TOML there would otherwise reach main and
      # surface as a formatter failure on someone else's machine.
      - id: check-toml
      - id: mixed-line-ending
        exclude: ^(\.fleet-ci/|tests/testthat/fixtures/corpus/)
      - id: check-case-conflict
  # Air: fast, R-free (Rust binary) formatter for R sources. Runs per commit and
  # auto-fixes; air.toml controls style + exclusions (so data-raw/ dev scripts
  # and the vendored .fleet-ci/ are skipped even when staged). Using the managed
  # air-pre-commit repo instead of a local `air format` hook means contributors
  # do not need air on PATH, and the version is pinned here.
  # https://posit-dev.github.io/air/
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format
  # British spellings in code, comments, string literals and tooling, which
  # spelling::spell_check_package() (the gate's docs tier) never reads: it
  # covers DESCRIPTION, roxygen, vignettes, README and NEWS only, and that gap
  # let British runtime messages ship (SEOR-xtmnpmae). Only the en-GB_to_en-US
  # dictionary is enabled, so this is not a general typo checker. codespell
  # skips dotfiles unless given --check-hidden, so .bestpractices.json is
  # skipped either way; it is listed so the intent survives a flag change.
  # Excluded: man/ (roxygen output; fix the roxygen source), test fixtures
  # (the validator corpus and hand-built fixtures are data, not prose), the
  # tracker snapshot (recorded text, regenerated wholesale),
  # .bestpractices.json (mirrors the live bestpractices.dev entry) and
  # .fleet-ci/ (fleet-ci's bin/vendor output). docs/ is hand-written source
  # here, docs/decisions/ included (no checker holds the ADRs immutable), so it
  # is checked.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|tests/testthat/fixtures/|docs/tracker-snapshot\.md$|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 ->
      # X.Y.Z), and every URL those two files declare must also appear in
      # DESCRIPTION's URL field. Ported from seor, where the rule is
      # design/adr/0001 and design/adr/0002. Offline, stdlib-only and instant,
      # so it runs on every push, after the gate.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports:, codemeta.json and every tracker link
      # (.bestpractices.json, CONTRIBUTING.md, SECURITY.md) name /-/work_items,
      # and no human-facing file may carry a /-/issues link (seor's ADR 0011:
      # https://gitlab.com/bart-turczynski/seor/-/blob/main/design/adr/0011-bugreports-names-work-items.md).
      # Offline, stdlib-only and instant, like check-citation above.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # check-news.py refuses a NEWS.md bullet that wraps, runs past its word
      # limit or names only housekeeping, and any Internal heading (seor's
      # design/fleet-standard.md, "NEWS.md bullets"; SEOR-skfshchx). Ported
      # byte for byte from seor. The check runs on every push, like
      # check-citation: it takes milliseconds. Its self-test runs when the
      # script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # Warns, loudly, when this clone's pre-push hook is not fleet-ci's, so
      # the push ran without the gate. Warn-only by decision, time-boxed until
      # the hook is installed fleet-wide, then it fails (SEOR-cjxarlcq). It
      # only reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed (warn-only)
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
