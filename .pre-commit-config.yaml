# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contained the double
# quotes from the rcmdcheck --as-cran argument). The chain now lives in
# tools/verify.R, so the hook invokes a script path and no shell quoting is
# involved at all. Keeping it in a file also means the gate is runnable on
# demand -- `Rscript tools/verify.R` -- instead of only as a side effect of
# pushing, which matters while the remote is unreachable.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # The imported validator corpus is deliberately byte-sensitive: fixtures
      # exercise trailing whitespace, CR/CRLF/CR line endings, BOMs, and
      # UTF-16, so the whitespace/EOL-normalizing hooks must not rewrite them.
      - id: end-of-file-fixer
        exclude: ^tests/testthat/fixtures/corpus/
      # README.md is generated by `devtools::build_readme()`, whose printed
      # tibble blocks carry column-padding trailing spaces. Stripping them here
      # made the committed file permanently unequal to what its own generator
      # produces, so the `readme` verify stage -- which re-renders and diffs --
      # could never pass (SITE-vntocfbg). A generated artifact belongs to its
      # generator; edit README.Rmd.
      - id: trailing-whitespace
        exclude: ^(tests/testthat/fixtures/corpus/|README\.md$)
      - id: check-merge-conflict
      - id: check-yaml
      # air.toml is the only TOML in the tree, and it drives the air-format
      # hook below. Unparseable TOML there would otherwise reach main and
      # surface as a formatter failure on someone else's machine.
      - id: check-toml
      - id: mixed-line-ending
        exclude: ^tests/testthat/fixtures/corpus/
      - id: check-case-conflict
  # Air: fast, R-free (Rust binary) formatter for R sources. Runs per commit and
  # auto-fixes; air.toml controls style + exclusions (so data-raw/ dev scripts
  # are skipped even when staged). Using the managed air-pre-commit repo instead
  # of a local `air format` hook means contributors do not need air on PATH,
  # and the version is pinned here. https://posit-dev.github.io/air/
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
  - repo: local
    hooks:
      # CITATION.cff's `version:` and .zenodo.json's `"version"` must name the
      # release DESCRIPTION's Version points at (X.Y.Z -> X.Y.Z; X.Y.Z.9000 ->
      # X.Y.Z), and every URL those two files declare must also appear in
      # DESCRIPTION's URL field. Ported from seor, where the rule is
      # design/adr/0001 and design/adr/0002. Offline, stdlib-only and instant,
      # so it runs alongside the R gate rather than inside it.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # offline and instant, and it runs ahead of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      - id: verify
        name: verify (the R gate)
        entry: Rscript tools/verify.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
