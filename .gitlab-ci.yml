# GitLab CI for sitemapr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and adds its x-floor job. A push to main or a branch, and a merge request,
# create no pipeline: the merge gate is the local one (.fleet-ci/gate, run by
# the .fleet-ci/pre-push hook). T2 runs on the deep-check schedule
# (SCHEDULE_KIND=deep-check), T3 on a RELEASE=1 web pipeline and a v* tag.
# design/ci.md has the whole picture and the gaps the migration accepted.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 5665e94723729437a1bf272e5d1587481c075187
    file: templates/r-package.yml

variables:
  # sitemapr has no compiled code (no src/), which the sanitizer leg exists
  # for; the former CI had no sanitizer job either.
  FLEET_SANITIZERS: "false"
  # The template's t2-floor installs every dependency from one dated
  # snapshot, and sitemapr's floor closure cannot come from one: rurl (>=
  # 3.0.1) and the other fleet packages postdate the last snapshot whose
  # curl still builds against the libcurl of R 4.1.3's image. So the floor
  # leg is x-floor, on .t2-job, in its place.
  FLEET_FLOOR: "false"

# The deep-check leg at the declared R floor, `Depends: R (>= 4.1.0)`, in
# place of the template's t2-floor (FLEET_FLOOR above): the former
# `floor-check` job, unchanged but for its rules, which .t2-job now gives.
# 4.1.3 is the last 4.1 patch and the oldest minor rocker publishes an arm64
# image for, which the runner needs; 4.0.5 has none.
#
# - Third-party packages come from one dated Posit Package Manager snapshot,
#   FLOOR_SNAPSHOT, installed with base install.packages() (source builds; the
#   runner is arm64 and that URL serves source). 2025-07-15, as in robotstxtr:
#   the first snapshot carrying httr2 1.2.0, which robotstxtr (a Suggests the
#   robots tests need) requires, while its curl is still 6.4.0, which builds
#   against libcurl 7.68 (every curl since 7.0.0 wants libcurl >= 7.73), and
#   its bit64 predates 4.8.0, which gcc 9 rejects.
# - The fleet packages postdate that snapshot, so they come after it: rurl
#   (DESCRIPTION wants >= 3.0.1), punycoder and pslr from current CRAN,
#   robotstxtr (>= 0.3.0, not on CRAN) from the fleet's r-universe. All declare
#   R >= 4.1 or lower, and their own dependencies are already installed from
#   the snapshot by then.
# - Only what the check needs is installed: the Imports, the test and vignette
#   Suggests, and rcmdcheck. oysteR and rosv serve only the audits, whose
#   tests skip without them, so _R_CHECK_FORCE_SUGGESTS_=false lets --as-cran
#   report them as a NOTE instead of stopping.
# - Vignettes are neither built nor checked: no pandoc in this image, and the
#   vignette exercises the same functions the tests do. The check is --as-cran
#   with CRAN incoming off (_R_CHECK_CRAN_INCOMING_ below; the two R_CRAN_*
#   variables point any CRAN metadata read at cloud.r-project.org rather than
#   the snapshot), error_on = "warning", a 300s download timeout (the
#   archive.rds stall, SITE-xolykhjm), and a guard on R CMD check's own exit
#   status, because rcmdcheck reads a check that halted partway as 0/0/0 and
#   returns normally (SEOR-maavnxdm).
#
# BLOCKING, like every T2 leg: a scheduled detector that cannot go red is
# worthless.
x-floor:
  extends: .t2-job
  image: rocker/r-ver:4.1.3
  variables:
    FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/2025-07-15"
    R_CRAN_SRC: "https://cloud.r-project.org"
    R_CRAN_WEB: "https://cloud.r-project.org"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    # Incoming off: .t2-job runs this leg in v* tag pipelines too, where the
    # incoming feasibility check's "Insufficient package version" (the tag's
    # version already on CRAN) would fail it and so block `pages`. t2-ascran
    # runs the incoming checks, on R release.
    _R_CHECK_CRAN_INCOMING_: "false"
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev zlib1g-dev pkg-config
    - >
      Rscript -e 'install.packages(c("htmltools", "httr2", "rlang", "tibble", "xml2",
      "stringi", "digest", "cpp11", "Rcpp",
      "cucumber", "testthat", "withr", "knitr", "rmarkdown", "rcmdcheck"),
      repos = Sys.getenv("FLOOR_SNAPSHOT"), Ncpus = 4L);
      install.packages(c("punycoder", "pslr", "rurl"),
      repos = "https://cloud.r-project.org", Ncpus = 4L);
      install.packages("robotstxtr",
      repos = "https://bart-turczynski.r-universe.dev", Ncpus = 4L);
      stopifnot(all(vapply(c("httr2", "xml2", "rurl", "robotstxtr", "cucumber", "testthat", "rcmdcheck"),
      requireNamespace, NA, quietly = TRUE)));
      print(R.version.string)'
    - >
      Rscript -e 'res <- rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
      build_args = c("--no-manual", "--no-build-vignettes"),
      error_on = "warning", check_dir = "check", env = c(R_DEFAULT_INTERNET_TIMEOUT = "300"));
      if (!identical(as.integer(res$status), 0L)) stop("R CMD check exited with status ", res$status, "; the run did not complete.", call. = FALSE)'
  artifacts:
    when: always
    paths:
      - check/
    expire_in: 1 week
